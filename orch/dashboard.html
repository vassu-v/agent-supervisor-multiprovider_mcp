<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Switchyard</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--fg:#1c1c1a;--mut:#6b6b66;--line:#e3e3dd;--ok:#2f7d4f;--busy:#b7791f;--dead:#a33;--acc:#2b5fd9}
@media(prefers-color-scheme:dark){:root{--bg:#161615;--card:#201f1e;--fg:#ecebe6;--mut:#9a9992;--line:#34332f;--ok:#5cc48a;--busy:#e3a948;--dead:#e07070;--acc:#7aa2ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,Segoe UI,sans-serif;padding:16px;max-width:1100px;margin:auto}
h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;margin:22px 0 8px;color:var(--mut);font-family:ui-monospace,Consolas,monospace;word-break:break-all}
.sub{color:var(--mut);margin-bottom:10px}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.id{font-weight:600}.pill{font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor}
.idle,.ready{color:var(--ok)}.busy,.degraded{color:var(--busy)}.dead,.starting,.off,.not_installed,.needs_login,.no_adapter{color:var(--dead)}.mut{color:var(--mut)}
.last{margin:6px 0 0;color:var(--mut);white-space:pre-wrap;word-break:break-word;max-height:4.4em;overflow:hidden}
button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:6px;padding:2px 9px;cursor:pointer}button:hover{border-color:var(--acc);color:var(--acc)}
.esc{border-color:var(--busy)}pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;max-height:260px;font-size:12px;white-space:pre-wrap;word-break:break-word}
.sp{flex:1}.prov{margin:0;padding:6px 10px;display:flex;gap:8px;align-items:center}</style></head><body>
<h1>Switchyard</h1><div class="sub" id="meta">connecting…</div>
<div id="prov" class="row" style="margin-bottom:6px"></div>
<div id="esc"></div><div id="groups"></div>
<h2 style="margin-top:26px">audit (latest)</h2><pre id="audit"></pre>
<script>
"use strict";
const TOKEN="__TOKEN__";
const H={"Authorization":"Bearer "+TOKEN,"Content-Type":"application/json"};
const get=u=>fetch(u,{headers:H}).then(r=>r.json());
const post=(p,b)=>fetch(p,{method:"POST",headers:H,body:JSON.stringify({by:"dashboard",...b})}).then(r=>r.json());
// every dynamic value goes through esc(); handlers are attached by delegation from data-* attributes (no inline JS)
const esc=s=>String(s??"").replace(/[&<>"'`]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;","`":"&#96;"}[c]));
const LAB={ready:"ready",degraded:"degraded",disabled:"off",not_installed:"not installed",needs_login:"needs login",no_adapter:"no adapter"};
const CLS={ready:"ready",degraded:"degraded",disabled:"off",not_installed:"not_installed",needs_login:"needs_login",no_adapter:"no_adapter"};
let open=null;
async function tick(){
  try{
    const [list,escs,audit,health,provs]=await Promise.all(["/api/list","/api/escalations","/api/audit?n=12","/api/health","/api/providers"].map(get));
    if(!Array.isArray(list))throw new Error(list.error||"bad response");
    document.getElementById("meta").textContent=`${list.length} agents · ${health.providers.length} of ${provs.length} providers usable · refreshes every 2s`;
    document.getElementById("prov").innerHTML=provs.map(p=>`<div class="card prov"><span class="id">${esc(p.name)}</span>
      <span class="pill ${esc(CLS[p.state]||"dead")}">${esc(LAB[p.state]||p.state)}</span>
      <span class="mut">${p.models?esc(p.models.length)+" models"+(p.models_source=="static"?" (aliases)":""):""}</span>
      <button data-act="toggle" data-name="${esc(p.name)}" data-enabled="${p.enabled?"0":"1"}">${p.enabled?"turn off":"turn on"}</button></div>`).join("");
    document.getElementById("esc").innerHTML=escs.length?"<h2>needs a decision</h2>"+escs.map(e=>`<div class="card esc"><div class="row"><span class="id">${esc(e.agent)}</span><span class="mut">${esc(e.why)}</span><span class="sp"></span>
      <button data-act="resolve" data-id="${esc(e.id)}" data-decision="allow">allow</button><button data-act="resolve" data-id="${esc(e.id)}" data-decision="deny">deny</button></div><pre>${esc(e.input)}</pre></div>`).join(""):"";
    const g={};list.forEach(a=>(g[a.cwd]=g[a.cwd]||[]).push(a));
    document.getElementById("groups").innerHTML=Object.keys(g).sort().map(d=>`<h2>${esc(d)}</h2>`+g[d].map(a=>`
      <div class="card"><div class="row"><span class="id">${esc(a.id)}</span><span class="pill ${esc(a.status)}">${esc(a.status)}</span>
      <span class="mut">${esc(a.provider)} · ${esc(a.model||"default")} · tier ${esc(a.tier)}</span><span class="sp"></span>
      <span class="mut">${esc(a.turns)} turns · ${esc(a.usage.input)}/${esc(a.usage.output)} tok · cache ${esc(a.usage.cache_read)}${a.restarts?` · ${esc(a.restarts)} restarts`:""}</span>
      <button data-act="events" data-id="${esc(a.id)}">events</button>${a.status!="dead"?`<button data-act="interrupt" data-id="${esc(a.id)}">interrupt</button><button data-act="stop" data-id="${esc(a.id)}">stop</button>`:""}</div>
      ${a.stopped_by?`<div class="mut">stopped by ${esc(a.stopped_by.by)}: ${esc(a.stopped_by.reason)}</div>`:""}
      ${a.needs_review?`<div class="busy">needs review before accepting</div>`:""}
      <div class="last">${esc(a.last_text)}</div>${open==a.id?`<pre id="ev"></pre>`:""}</div>`).join("")).join("");
    document.getElementById("audit").textContent=audit.map(x=>new Date(x.ts*1000).toLocaleTimeString()+"  "+x.kind+"  "+(x.agent||x.escalation||x.provider||"")+"  "+(x.reason||x.why||x.decision||x.text||"")).join("\n");
    if(open){const ev=await get("/api/tail?id="+encodeURIComponent(open)+"&n=40");const el=document.getElementById("ev");
      if(el&&Array.isArray(ev))el.textContent=ev.map(e=>e.type+"  "+(e.text||(e.tool?e.tool+" "+JSON.stringify(e.input??""):"")||e.state||e.why||e.message||"")).join("\n")}
  }catch(e){document.getElementById("meta").textContent="orchestrator unreachable or token rejected"}
}
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button[data-act]");if(!b)return;
  const d=b.dataset;
  if(d.act=="toggle")await post("/api/provider",{name:d.name,enabled:d.enabled=="1"});
  else if(d.act=="resolve")await post("/api/resolve",{escalation:d.id,decision:d.decision});
  else if(d.act=="interrupt")await post("/api/interrupt",{id:d.id});
  else if(d.act=="events")open=open==d.id?null:d.id;
  else if(d.act=="stop"){const r=prompt("Reason for stopping "+d.id+"?");if(r)await post("/api/stop",{id:d.id,reason:r})}
  tick();
});
tick();setInterval(tick,2000);
</script></body></html>
