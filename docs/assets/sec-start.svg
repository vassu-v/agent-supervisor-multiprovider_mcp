<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" role="img" aria-label="Quick start: clone, serve, spawn">
  <title>Quick start: clone, serve, spawn</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151d36"/></linearGradient></defs>
  <rect width="960" height="170" rx="18" fill="url(#bg)"/><rect width="960" height="170" rx="18" fill="none" stroke="#26324f"/>
  <text x="44" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#f59e0b">01  ·  START</text>
  <text x="44" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f5fb">Clone it, run it,</text>
  <text x="44" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f5fb">spawn your first agent.</text>
  <g transform="translate(500,0)"><path d="M20 85 H440" stroke="#26324f" stroke-width="8" stroke-linecap="round" fill="none"/><circle cx="40" cy="85" r="8" fill="#0b1020" stroke="#f59e0b" stroke-width="3"/><text x="40" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f3f5fb" text-anchor="middle">clone</text><circle cx="190" cy="85" r="8" fill="#0b1020" stroke="#f59e0b" stroke-width="3"/><text x="190" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f3f5fb" text-anchor="middle">serve</text><circle cx="340" cy="85" r="8" fill="#0b1020" stroke="#f59e0b" stroke-width="3"/><text x="340" y="122" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f3f5fb" text-anchor="middle">spawn</text><rect x="60" y="80" width="110" height="10" rx="5" fill="#f59e0b"/><text x="115" y="60" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9fb0d6" text-anchor="middle">1 min</text><path d="M210 85 H320" stroke="#f59e0b" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><text x="380" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9fb0d6" text-anchor="middle">agent runs</text><rect x="360" y="80" width="70" height="10" rx="5" fill="#4ade80"/></g>
</svg>
