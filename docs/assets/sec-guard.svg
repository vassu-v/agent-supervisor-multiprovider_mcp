<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" role="img" aria-label="Guard verdicts: pass, escalate, block">
  <title>Guard verdicts: pass, escalate, block</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151d36"/></linearGradient></defs>
  <rect width="960" height="170" rx="18" fill="url(#bg)"/><rect width="960" height="170" rx="18" fill="none" stroke="#26324f"/>
  <text x="44" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#f59e0b">03  ·  GUARD</text>
  <text x="44" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f5fb">Risky calls wait</text>
  <text x="44" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f5fb">for your say-so.</text>
  <g transform="translate(500,0)"><text x="0" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f3f5fb" text-anchor="start">pass</text><path d="M110 45 H400" stroke="#26324f" stroke-width="8" stroke-linecap="round" fill="none"/><text x="0" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f3f5fb" text-anchor="start">escalate</text><path d="M110 92 H400" stroke="#26324f" stroke-width="8" stroke-linecap="round" fill="none"/><text x="0" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#f3f5fb" text-anchor="start">block</text><path d="M110 139 H400" stroke="#26324f" stroke-width="8" stroke-linecap="round" fill="none"/><rect x="110" y="40" width="220" height="10" rx="5" fill="#4ade80"/><path d="M340 38 L356 45 L340 52 Z" fill="#4ade80"/><text x="374" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9fb0d6" text-anchor="start">runs</text><rect x="110" y="87" width="152" height="10" rx="5" fill="#f59e0b"/><circle cx="290" cy="92" r="13" fill="#f87171"/><rect x="284" y="85" width="4" height="14" fill="#0b1020"/><rect x="292" y="85" width="4" height="14" fill="#0b1020"/><text x="312" y="97" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9fb0d6" text-anchor="start">waits for you</text><rect x="110" y="134" width="152" height="10" rx="5" fill="#f87171"/><path d="M276 125 V153 M276 139 H292" stroke="#f87171" stroke-width="5" stroke-linecap="round"/><text x="304" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#9fb0d6" text-anchor="start">stopped</text></g>
