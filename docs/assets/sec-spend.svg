<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" role="img" aria-label="Tiers: bulk on cheap models, hard flagged for review">
  <title>Tiers: bulk on cheap models, hard flagged for review</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#151d36"/></linearGradient></defs>
  <rect width="960" height="170" rx="18" fill="url(#bg)"/><rect width="960" height="170" rx="18" fill="none" stroke="#26324f"/>
  <text x="44" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#f59e0b">04  ·  SPEND</text>
  <text x="44" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f5fb">Cheap models for bulk,</text>
  <text x="44" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f5fb">a strong one to review.</text>
