  <rect width="960" height="170" rx="18" fill="url(#bg)"/><rect width="960" height="170" rx="18" fill="none" stroke="#26324f"/>
  <text x="44" y="70" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#f59e0b">02  ·  STEER</text>
  <text x="44" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f5fb">Same session,</text>
  <text x="44" y="136" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#f3f5fb">new direction.</text>
